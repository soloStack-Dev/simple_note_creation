<!-- One note: category badge, message, and the owner's edit/delete buttons. -->
<div th:fragment="card(note)" class="card mn-note mn-swap-fade h-100" th:id="'note-' + ${note.id}"
  th:attr="data-category=${note.category.name()}">

  <div class="card-body d-flex flex-column">
    <span class="badge rounded-pill align-self-start mb-3 mn-note__badge" th:text="${note.category.label}">Category</span>
    <p class="card-text mn-note__message flex-grow-1 mb-0" th:text="${note.message}">Message</p>
  </div>

  <div class="card-footer bg-transparent border-0 d-flex flex-wrap justify-content-between align-items-center gap-2">
    <small class="mn-note__meta">
      <span th:text="${note.owner.username}">author</span>
      <span aria-hidden="true">&middot;</span>
      <span th:text="${#temporals.format(note.createdAt, 'dd MMM yyyy HH:mm')}">date</span>
    </small>

    <div class="btn-group btn-group-sm" th:if="${currentUserId != null and currentUserId == note.owner.id}">
      <button class="btn btn-outline-secondary" type="button"
        th:attr="hx-get=@{'/fragments/note/' + ${note.id} + '/edit'}"
        hx-target="closest .mn-note" hx-swap="outerHTML"
        hx-disabled-elt="this">
        Edit
      </button>
      <button class="btn btn-outline-danger" type="button"
        th:attr="hx-delete=@{'/notes/' + ${note.id}}"
        hx-target="#notesGrid" hx-swap="outerHTML"
        hx-confirm="Delete this note? This cannot be undone."
        hx-disabled-elt="this">
        Delete
      </button>
    </div>
  </div>

</div>
