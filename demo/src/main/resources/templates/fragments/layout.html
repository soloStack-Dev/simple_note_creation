<!-- Head fragment: Bootstrap 5.3.8 + the CSRF token htmx needs for mutations. -->
<head th:fragment="head(pageTitle)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle != null ? pageTitle + ' - Memory Notes' : 'Memory Notes'}">Memory Notes</title>

  <!-- htmx reads these so every hx-post / hx-delete carries the CSRF token. -->
  <meta name="csrf-token" th:content="${_csrf != null} ? ${_csrf.token} : ''">
  <meta name="csrf-header" th:content="${_csrf != null} ? ${_csrf.headerName} : 'X-CSRF-TOKEN'">

  <!-- Runs before the body paints, so a reader who chose dark does not get a
       flash of the light theme first. Kept inline and tiny for that reason:
       deferring it to app.js would be too late. -->
  <script>
    (function () {
      var stored;
      try {
        stored = localStorage.getItem("mn-theme");
      } catch (e) {
        /* Private mode: fall back to the OS preference below. */
      }
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-bs-theme", theme);
    })();
  </script>

  <!-- The integrity hashes below are sha384 of the exact 5.3.8 / 2.0.11 files. They are
       version-specific: a stale hash makes the browser refuse the asset outright, which
       silently takes the whole page down (no Bootstrap JS means no modal, no dropdown). -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-b11225e24c482c5bd8e3b275e9cafd670074eef3f827cf8b1fba8a427baa92e200bcd58bcde37cb44e5806e8d9a892c1"
    crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<!-- Navbar: brand, the three nav links, and the authentication corner. -->
<nav th:fragment="navbar(activePage)" class="navbar navbar-expand-lg mn-nav sticky-top py-3">
  <div class="container">
    <a class="navbar-brand mn-nav__brand" th:href="@{/}">
      <span class="mn-nav__mark" aria-hidden="true">M</span>
      <span>Memory Notes</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
      aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-1">
        <li class="nav-item">
          <a class="nav-link" th:classappend="${activePage == 'home'} ? 'active'" th:href="@{/}"
            th:attr="aria-current=${activePage == 'home'} ? 'page'">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:classappend="${activePage == 'about'} ? 'active'" th:href="@{/about}"
            th:attr="aria-current=${activePage == 'about'} ? 'page'">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:classappend="${activePage == 'note'} ? 'active'" th:href="@{/notes}"
            th:attr="aria-current=${activePage == 'note'} ? 'page'">Note</a>
        </li>
      </ul>

      <!-- Top corner: theme toggle, then Sign Up / Log In for a visitor or the
           profile menu once signed in. -->
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-2"
          type="button" data-mn-theme-toggle>
          <span class="mn-theme-icon-light" aria-hidden="true">&#9789;</span>
          <span class="mn-theme-icon-dark" aria-hidden="true">&#9788;</span>
          <span class="d-none d-sm-inline" data-mn-theme-label>Dark</span>
        </button>

        <div th:unless="${authenticated}" class="d-flex gap-2">
          <a class="btn btn-outline-secondary btn-sm" th:href="@{/signup}">Sign Up</a>
          <a class="btn btn-primary btn-sm" th:href="@{/login}">Log In</a>
        </div>

        <div th:if="${authenticated}" class="dropdown">
          <button class="btn btn-outline-secondary btn-sm dropdown-toggle mn-profile-toggle"
            type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Profile menu"
            th:text="${#strings.substring(currentUsername, 0, 1).toUpperCase()}">P</button>

          <div class="dropdown-menu dropdown-menu-end mn-profile-menu">
            <div class="mn-profile-menu__head">
              <h2 class="h6 mb-0" th:text="${currentUsername}">username</h2>
              <small class="text-body-secondary"
                th:text="${currentUser != null} ? ${currentUser.email} : ''">email</small>
            </div>

            <!-- Read-only view. The Edit button below reveals the same details as
                 editable fields. -->
            <div class="mn-profile-menu__body">
              <p class="mb-1 fw-semibold small">Bio</p>
              <p class="mn-profile-menu__bio mb-3" data-bio-summary
                th:text="${currentUser != null and !#strings.isEmpty(currentUser.bio)} ? ${currentUser.bio} : 'No bio yet.'">
                No bio yet.</p>

              <button class="btn btn-outline-secondary btn-sm w-100" type="button"
                data-bs-toggle="collapse" data-bs-target="#profileEditor"
                aria-expanded="false" aria-controls="profileEditor">
                Edit profile
              </button>

              <div class="collapse" id="profileEditor">
                <form th:action="@{/profile}" method="post" class="d-flex flex-column gap-3 mt-3">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                  <div>
                    <label class="form-label small mb-1" for="profileUsername">Username</label>
                    <!-- Username is the identity key, so it is shown but not editable. -->
                    <input class="form-control form-control-sm" type="text" id="profileUsername"
                      th:value="${currentUsername}" readonly aria-readonly="true" tabindex="-1">
                  </div>

                  <div>
                    <label class="form-label small mb-1" for="profileEmail">Email</label>
                    <input class="form-control form-control-sm" type="email" id="profileEmail" name="email"
                      th:value="${currentUser != null} ? ${currentUser.email} : ''" required>
                  </div>

                  <div>
                    <label class="form-label small mb-1" for="profileBio">Bio</label>
                    <textarea class="form-control form-control-sm" id="profileBio" name="bio" rows="6"
                      data-bio-input minlength="150" required
                      th:text="${currentUser != null} ? ${currentUser.bio} : ''"></textarea>
                    <div class="form-text">
                      Write at least 150 characters about yourself.
                      <span class="d-block small" data-bio-counter>0 / 150 characters</span>
                    </div>
                  </div>

                  <div class="d-flex gap-2">
                    <button class="btn btn-primary btn-sm flex-grow-1" type="submit">Save</button>
                    <button class="btn btn-outline-secondary btn-sm" type="button"
                      data-bs-toggle="collapse" data-bs-target="#profileEditor">Cancel</button>
                  </div>
                </form>
              </div>
            </div>

            <div class="p-3 pt-0">
              <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-outline-danger btn-sm w-100" type="submit">Sign Out</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<footer th:fragment="footer" class="mn-footer mt-auto py-4">
  <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2">
    <span>Memory Notes &mdash; write down your life, memories and ideas.</span>
    <span>Spring Boot &middot; Thymeleaf &middot; HTMX &middot; Bootstrap</span>
  </div>
</footer>

<!-- Bootstrap bundle includes Popper, so dropdowns and modals work out of the box. -->
<th:block th:fragment="scripts">
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-14aca8105a2b086972bf0c7d1e3d3d25c627de7bfbc223d5973ed863026b5957172bf0669d50f133e0f6b1c41b213c48"
    crossorigin="anonymous"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
    integrity="sha384-d8e6adcd0cb51fe65dfc822b8ebd5372e0c6a8b5de1e16e8a00c8963529d40c2a7af82d9db6937d4604b7582879958e0"
    crossorigin="anonymous"></script>
  <script th:src="@{/js/app.js}"></script>
</th:block>
