<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${pageTitle})}">
  <title>Log In</title>
</head>

<body class="mn-shell">

<nav th:replace="~{fragments/layout :: navbar('')}"></nav>
<div th:replace="~{fragments/flash :: messages}"></div>

<main class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-9 col-lg-5">

        <div class="card mn-tile">
          <div class="card-body p-4 p-md-5">

            <h1 class="h4 mb-1">Log In</h1>
            <p class="text-body-secondary small mb-4">Use the username you signed up with.</p>

            <div th:if="${loginFailed}" class="alert alert-danger" role="alert">
              That username and password did not match an account.
            </div>

            <form th:action="@{/login(returnUrl=${returnUrl})}" method="post" novalidate>
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

              <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" type="text" id="username" name="username"
                  th:value="${username}" autocomplete="username" required autofocus>
              </div>

              <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password" name="password"
                  autocomplete="current-password" required>
              </div>

              <button class="btn btn-primary w-100" type="submit">Log In</button>
            </form>

            <p class="text-center small text-body-secondary mt-4 mb-0">
              No account yet? <a th:href="@{/signup}">Sign Up</a>
            </p>

          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>

</html>
