<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${pageTitle})}">
  <title>Sign Up</title>
</head>

<body class="mn-shell">

<nav th:replace="~{fragments/layout :: navbar('')}"></nav>
<div th:replace="~{fragments/flash :: messages}"></div>

<main class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-9 col-lg-5">

        <div class="card mn-tile">
          <div class="card-body p-4 p-md-5">

            <h1 class="h4 mb-1">Sign Up</h1>
            <p class="text-body-secondary small mb-4">Create an account to start writing.</p>

            <div th:if="${!#lists.isEmpty(errors)}" class="alert alert-danger" role="alert">
              <ul class="mb-0 ps-3">
                <li th:each="error : ${errors}" th:text="${error}">error</li>
              </ul>
            </div>

            <form th:action="@{/signup}" method="post" novalidate>
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

              <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" type="text" id="username" name="username"
                  th:value="${username}" autocomplete="username" required autofocus>
              </div>

              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" name="email"
                  th:value="${email}" autocomplete="email" required>
              </div>

              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password" name="password"
                  autocomplete="new-password" required>
                <div class="form-text">At least 6 characters.</div>
              </div>

              <div class="mb-4">
                <label class="form-label" for="bio">Bio <span class="text-body-secondary">(optional)</span></label>
                <textarea class="form-control" id="bio" name="bio" rows="5"
                  data-bio-input minlength="150"
                  placeholder="A line or two about you" th:text="${bio}"></textarea>
                <div class="form-text">
                  If you add a bio, write at least 150 characters. You can leave it empty and
                  fill it in later from your profile.
                  <span class="d-block small" data-bio-counter>0 / 150 characters</span>
                </div>
              </div>

              <button class="btn btn-primary w-100" type="submit">Create account</button>
            </form>

            <p class="text-center small text-body-secondary mt-4 mb-0">
              Already have an account? <a th:href="@{/login}">Log In</a>
            </p>

          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>

</html>
