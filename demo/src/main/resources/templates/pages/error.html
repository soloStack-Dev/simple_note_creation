<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Error')}">
  <title>Error</title>
</head>

<body class="mn-shell">

<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<main class="py-5">
  <div class="container">
    <div class="row justify-content-center text-center">
      <div class="col-12 col-md-8 col-lg-6">

        <p class="display-1 fw-semibold mn-display mb-0" th:text="${statusCode} ?: 'Error'">500</p>
        <h1 class="h4 mb-3" th:text="${errorTitle}">Something went wrong</h1>
        <p class="text-body-secondary" th:text="${errorMessage}">The error was recorded.</p>

        <p class="small text-body-secondary">
          This failure was written to the ErrorEnquiry table so it can be reviewed.
        </p>

        <a class="btn btn-primary" th:href="@{/}">Back home</a>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>

</html>
