spring.application.name=demo

# ---------------------------------------------------------------------------
# Database - H2 in-memory, database name NoteDB
# DB_CLOSE_DELAY=-1 keeps the schema alive while the JVM runs; without it an
# in-memory database can be dropped between connections.
#
# DATA IS LOST ON EVERY RESTART. To keep it, override the URL with a file database:
#   DATABASE_URL=jdbc:h2:file:/data/NoteDB;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE
# which is what docker-compose.yml mounts a volume for.
# ---------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:NoteDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# ---------------------------------------------------------------------------
# H2 console - reachable at /h2-console with no app token. It is permitted in
# the security chain and CSRF is skipped for it, so the console's own JDBC
# URL / username / password form is the only gate.
# web-allow-others is required for the container-published port to work.
# ---------------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ---------------------------------------------------------------------------
# Security - token based.
#
# User credentials are deliberately NOT set with spring.security.user.*.
# Sign-up writes username / email / BCrypt password into the AuthSource table and
# AppUserDetailsService authenticates against that table, so a fixed
# spring.security.user.* entry would be inert at best and would mask real sign-up
# bugs at worst. What is configured here is the token policy itself.
# ---------------------------------------------------------------------------
app.security.token.cookie-name=note_token
app.security.token.ttl=PT8H

# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------
spring.thymeleaf.check-template-location=true
server.error.include-message=always
server.error.include-binding-errors=always
